name: Build and deploy ASP.Net Core app to Azure Web App - Print-it

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # Build solution
      - name: Build with dotnet
        working-directory: PrintIt/PrintIt
        run: dotnet build PrintIt.sln --configuration Release

      # Publish
      - name: dotnet publish
        working-directory: PrintIt/PrintIt
        run: dotnet publish PrintIt.sln -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      # Upload artifact for deployment
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E217FCAB05F64B1895B3CF817391F6A4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C6F0E5A5321C49C490E26BCACC16FC01 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_15A6966EF8074A6286DC9ECD30AAF7FA }}

      # Deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'print-it3d'
          slot-name: 'Production'
          package: .

      # Optional: Set secrets as environment variables on Azure App Service
      - name: Set Azure App Service Application Settings
        uses: azure/appservice-settings@v2
        with:
          app-name: 'print-it3d'
          slot-name: 'Production'
          app-settings: |
            Stripe__SecretKey=${{ secrets.STRIPE_SECRETKEY }}
            Stripe__PublishableKey=${{ secrets.STRIPE_PUBLISHABLEKEY }}
            Authentication__Google__ClientId=${{ secrets.GOOGLE_CLIENTID }}
            Authentication__Google__ClientSecret=${{ secrets.GOOGLE_CLIENTSECRET }}
