name: Build and deploy ASP.NET Core app to Azure Web App - Print-it

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Setup .NET SDK
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore PrintIt/PrintIt.sln

      # Build solution
      - name: Build solution
        run: dotnet build PrintIt/PrintIt.sln --configuration Release

      # Publish solution
      - name: Publish solution
        run: dotnet publish PrintIt/PrintIt.sln -c Release -o ${{ github.workspace }}/publish --self-contained false

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # Download build artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ${{ github.workspace }}/publish

      # Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      # Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'print-it3d'
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish

      # Set App Service Application Settings using Azure CLI
      - name: Configure App Settings
        uses: azure/cli@v1
        with:
          azcliversion: 2.100.0
          inlineScript: |
            az webapp config appsettings set \
              --name print-it3d \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --settings Stripe__SecretKey=${{ secrets.STRIPE_SECRETKEY }} \
                        Stripe__PublishableKey=${{ secrets.STRIPE_PUBLISHABLEKEY }} \
                        Authentication__Google__ClientId=${{ secrets.GOOGLE_CLIENTID }} \
                        Authentication__Google__ClientSecret=${{ secrets.GOOGLE_CLIENTSECRET }}