name: Deploy PrintIt App

on:
  push:
    branches: [ "main" ] # Runs every time you push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # IMPORTANT: Use the exact name of the Environment you created in GitHub
    environment: SecretKeys 

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    - name: Build with Secrets
      shell: bash
      run: |
        dotnet build --configuration Release
      env:
        # This maps your GitHub Secrets to the build environment 
        # so they are available if you run integration tests
        Stripe__SecretKey: ${{ secrets.Stripe__SecretKey }}
        Authentication__Google__ClientSecret: ${{ secrets.Authentication__Google__ClientSecret }}

    - name: Publish
      run: dotnet publish -c Release -o ./publish

    # --- DEPLOYMENT STEP ---
    # This part depends on your host. 
    # If using Azure, you'd use 'azure/webapps-deploy@v2'
    # If using a VPS, you'd use 'appleboy/scp-action'